<div class="notif-page">

  <!-- Header -->
  <div class="notif-header">
    <div class="notif-header__left">
      <a routerLink="/dashboard" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </a>
      <div>
        <h1 class="notif-title">Notificaciones</h1>
        <p class="notif-count" *ngIf="totalNoLeidas > 0">
          {{ totalNoLeidas }} sin leer
        </p>
      </div>
    </div>
    <button class="btn-leer-todas" (click)="leerTodas()" *ngIf="totalNoLeidas > 0">
      Leer todas
    </button>
  </div>

  <!-- NUEVAS -->
  <ng-container *ngIf="nuevas().length > 0">
    <p class="section-label">NUEVAS</p>
    <div class="notif-card">
      <div
        class="notif-item"
        *ngFor="let n of nuevas(); let last = last"
        [class.notif-item--last]="last"
        (click)="marcarLeida(n.id)"
      >
        <span class="unread-dot"></span>
        <span class="notif-emoji">{{ n.icono }}</span>
        <div class="notif-body">
          <p class="notif-text">
            <strong *ngIf="n.categoria">{{ n.categoria }}:</strong>
            {{ n.mensaje }}
          </p>
          <span class="notif-time">{{ n.tiempo }}</span>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- ANTERIORES -->
  <ng-container *ngIf="anteriores().length > 0">
    <p class="section-label" [class.section-label--first]="nuevas().length === 0">ANTERIORES</p>
    <div class="notif-card">
      <div
        class="notif-item notif-item--read"
        *ngFor="let n of anteriores(); let last = last"
        [class.notif-item--last]="last"
      >
        <span class="read-dot"></span>
        <span class="notif-emoji notif-emoji--dim">{{ n.icono }}</span>
        <div class="notif-body">
          <p class="notif-text notif-text--read">{{ n.mensaje }}</p>
          <span class="notif-time">{{ n.tiempo }}</span>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="nuevas().length === 0 && anteriores().length === 0">
    <span class="empty-icon">🔔</span>
    <p>No tenés notificaciones por ahora.</p>
  </div>

</div>
